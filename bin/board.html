<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentsemble</title>
<style>
  :root {
    --page: #f4f5f8; --surface: #fbfcfd;
    --text: #191f28; --sub: #4e5968; --faint: #6b7684;
    --hair: #e5e8eb; --ring: inset 0 0 0 1px rgba(2,32,71,.06);
    --live: #e0303e; --calm: #1b64da; --warn: #b26b00; --good: #0f8a4c; --me: #0a66ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #17171c; --surface: #1f2027;
      --text: #e9ecef; --sub: #b6bec7; --faint: #8d96a3;
      --hair: #2b2d36; --ring: inset 0 0 0 1px rgba(255,255,255,.07);
      --live: #ff6b76; --calm: #6ea8ff; --warn: #f5b04a; --good: #3fd08a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  button { font: inherit; }

  .bar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 2px 14px; }
  h1 { font-size: 15px; margin: 0; }
  .meta { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .meta b { color: var(--text); font-weight: 650; }
  .meta .warn { color: var(--warn); }
  .repo { margin-left: auto; }

  .tabs { display: flex; gap: 2px; margin: 0 0 14px; border-bottom: 1px solid var(--hair); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .tab { appearance: none; background: none; border: 0; cursor: pointer; white-space: nowrap;
    font-size: 13px; font-weight: 650; color: var(--sub); min-height: 44px;
    padding: 8px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--calm); }
  .tab .n { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--faint); margin-left: 4px; }
  [role="tabpanel"][hidden] { display: none; }

  .cards { display: grid; gap: 12px; align-items: start;
    grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); }
  .win { background: var(--surface); box-shadow: var(--ring); border-radius: 16px;
    padding: 14px 16px 12px; display: grid; gap: 8px; cursor: pointer; text-align: left; width: 100%;
    border: 0; color: inherit; }
  .win:hover, .win:focus-visible { box-shadow: inset 0 0 0 1.5px var(--calm); outline: none; }
  .win.moving { box-shadow: inset 0 0 0 1.5px var(--live); }
  .win.main { box-shadow: inset 0 0 0 2px var(--text); }
  .head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .nm { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .role { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; flex: none;
    color: var(--surface); background: var(--text); border-radius: 5px; padding: 1px 6px; }
  .role.sub { background: var(--sub); }
  .ph { margin-left: auto; font-size: 11.5px; color: var(--sub); flex: none; }
  .ph.moving { color: var(--live); font-weight: 650; }
  .ph.busy { color: var(--warn); font-weight: 650; }
  .asked { font-size: 12.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .asked i { font-style: normal; color: var(--faint); margin-right: 6px; }
  .flow { display: grid; gap: 2px; font-size: 12px; }
  .flow div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--sub); }
  .flow b { font-weight: 650; color: var(--text); margin-right: 6px; }
  .foot { display: flex; gap: 10px; align-items: center; font-size: 11.5px; color: var(--sub);
    font-variant-numeric: tabular-nums; }
  .copy { appearance: none; border: 0; background: var(--page); color: var(--sub); cursor: pointer;
    margin-left: auto; border-radius: 8px; padding: 4px 10px; min-height: 28px; font-size: 11.5px; }
  .copy:hover { color: var(--text); }
  code.cmd { display: block; font-size: 11px; white-space: pre-wrap; word-break: break-all; color: var(--sub); }

  .trunk { width: 2px; height: 16px; background: var(--faint); margin-left: 34px; }
  .subs { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start;
    border-top: 2px solid var(--faint); padding-top: 16px; margin: 0 0 20px 34px; }
  .sub { width: 380px; max-width: 100%; }
  .order { font-size: 11.5px; color: var(--sub); margin: 0 0 6px 8px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .order b { color: var(--text); font-weight: 650; }
  .empty { padding: 14px; color: var(--sub); font-size: 13px; }

  .card { background: var(--surface); box-shadow: var(--ring); border-radius: 14px; padding: 4px 0; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 7px 14px; border-bottom: 1px solid var(--hair); }
  .row:last-child { border-bottom: 0; }
  .rid { font-weight: 650; font-size: 12px; width: 34px; flex: none; font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; font-weight: 650; flex: none; width: 56px; }
  .tag.claim { color: var(--calm); } .tag.confirm { color: var(--good); }
  .tag.refute { color: var(--live); } .tag.hold { color: var(--warn); } .tag.note { color: var(--sub); }
  .what { font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when { margin-left: auto; font-size: 11px; color: var(--sub); flex: none; }

  details.fold { border-bottom: 1px solid var(--hair); }
  details.fold:last-child { border-bottom: 0; }
  details.fold > summary { display: flex; gap: 8px; align-items: baseline; padding: 10px 14px; min-height: 44px;
    cursor: pointer; list-style: none; font-size: 12.5px; color: var(--sub); }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: '▸'; width: 10px; flex: none; }
  details.fold[open] > summary::before { content: '▾'; }
  details.fold > summary b { color: var(--text); font-weight: 650; }
  details.fold > summary .cnt { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; }
  details.fold .row, details.fold details.fold > summary { padding-left: 28px; }

  .kit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--hair); }
  .kit:last-child { border-bottom: 0; }
  .kit .who { font-weight: 700; width: 90px; flex: none; }
  .kit span.i { font-size: 12px; border-radius: 6px; padding: 2px 8px; box-shadow: inset 0 0 0 1px var(--hair); color: var(--text); }
  .kit span.plug { background: var(--page); box-shadow: none; }
  .kit span.miss { box-shadow: inset 0 0 0 1.5px var(--live); }
  .kit span.miss::after { content: ' missing'; font-weight: 700; }
  .kit span.extra { box-shadow: none; outline: 1px dashed var(--sub); outline-offset: -1px; }
  .kit span.extra::before { content: '+ '; }
  .kit span.plan { color: var(--sub); }
  .kit span.shared { color: var(--sub); box-shadow: none; }
  .kit .note { font-size: 11.5px; color: var(--sub); margin-left: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 14px; border-bottom: 1px solid var(--hair); }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 650; color: var(--sub); font-size: 11.5px; }
  .fine { font-size: 11.5px; color: var(--sub); margin: 8px 2px 0; }

  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); background: var(--surface);
    box-shadow: -8px 0 32px rgba(0,0,0,.18); display: flex; flex-direction: column; z-index: 10; }
  .drawer[hidden] { display: none; }
  .dh { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hair); }
  .dh b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { appearance: none; border: 0; background: none; font-size: 18px; color: var(--sub); cursor: pointer;
    margin-left: auto; width: 44px; height: 44px; border-radius: 8px; flex: none; }
  .x:hover { background: var(--page); color: var(--text); }
  .dtabs { display: flex; gap: 2px; flex: none; }
  .dtabs button { appearance: none; border: 0; background: none; font-size: 12.5px; font-weight: 650; color: var(--sub);
    min-height: 36px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .dtabs button[aria-pressed="true"] { background: var(--page); color: var(--text); }
  .unread { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--me); margin-right: 6px; flex: none; }
  .notify { appearance: none; border: 1px solid var(--hair); background: var(--surface); color: var(--sub); font-size: 12px;
    border-radius: 999px; padding: 4px 10px; min-height: 28px; cursor: pointer; }
  .notify[aria-pressed="true"] { color: var(--good); border-color: var(--good); }
  .files { font-size: 12.5px; display: grid; grid-template-columns: 1fr auto auto; gap: 2px 12px; font-variant-numeric: tabular-nums; }
  .files .a { color: var(--good); } .files .d { color: var(--live); }
  .patch { margin: 0; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre; overflow-x: auto;
    background: var(--page); border-radius: 8px; padding: 8px 10px; }
  .patch .a { color: var(--good); } .patch .d { color: var(--live); } .patch .h { color: var(--faint); }
  .who { font-weight: 650; font-size: 13px; margin-top: 6px; }
  .clashes button { appearance: none; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 2px; }
  .db { flex: 1; overflow-y: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 8px; overscroll-behavior: contain; }
  .more { align-self: center; appearance: none; border: 0; background: var(--page); color: var(--sub);
    font-size: 12px; padding: 8px 16px; border-radius: 999px; cursor: pointer; min-height: 36px; }
  .bub { max-width: 86%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap; }
  .bub.me { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 4px; }
  .bub.claude { align-self: flex-start; background: var(--page); border-bottom-left-radius: 4px; }
  .bub.in { align-self: flex-start; box-shadow: inset 0 0 0 1.5px var(--warn); }
  .bub .t { display: block; font-size: 10.5px; opacity: .8; margin-bottom: 2px; }
  .tools { font-size: 11.5px; color: var(--sub); }
  .tools summary { cursor: pointer; padding: 2px 4px; }
  .tools ol { margin: 4px 0; padding-left: 22px; }
  .tools li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: no-preference) { .win { transition: box-shadow .15s; } }

  /* Map: roles on the left, the repo's areas on the right, live lines between them. */
  .grid { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .grid th, .grid td { padding: 9px 10px; border-bottom: 1px solid var(--hair); text-align: center; white-space: nowrap; }
  .grid thead th { font-size: 12px; font-weight: 650; color: var(--sub); vertical-align: bottom; }
  .grid thead th small { display: block; font-weight: 400; color: var(--faint); }
  .grid th.who { text-align: left; font-weight: 650; color: var(--text); }
  .grid th.who small { display: block; font-weight: 400; color: var(--faint); font-size: 11.5px; }
  .grid th.who[data-open] { cursor: pointer; } .grid th.who[data-open]:hover { color: var(--calm); }
  .grid tr:last-child > * { border-bottom: 0; }
  .grid td { color: var(--faint); }
  .grid td.own { color: var(--text); }
  .grid td.work b { color: var(--calm); }
  .grid td.stray b { color: var(--warn); }
  .grid td.work, .grid td.stray { cursor: pointer; }
  .grid .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: var(--hair); vertical-align: 1px; }
  .grid .dot.moving { background: var(--good); } .grid .dot.busy { background: var(--warn); } .grid .dot.waiting { background: var(--calm); }
  .grid .clash { color: var(--live); }
  .grid .new { color: var(--me); font-size: 11px; font-weight: 650; margin-left: 4px; }
  .grid .open { appearance: none; border: 1px solid var(--hair); background: var(--surface); color: var(--text); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .grid .open:hover { border-color: var(--calm); }
  .grid-wrap { overflow-x: auto; }
  .clashes { color: var(--live); font-size: 12.5px; margin: 10px 2px 0; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--page); padding: 9px 14px; border-radius: 10px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
</style>

<div class="wrap">
  <div class="bar">
    <h1>agentsemble</h1>
    <span class="meta" id="tally"></span>
    <button type="button" class="notify" id="notify" hidden>Notify me</button>
    <span class="meta repo" id="repo"></span>
  </div>

  <div class="tabs" role="tablist" aria-label="Board">
    <button class="tab" role="tab" id="t-map" aria-controls="p-map" aria-selected="true">Map<span class="n" id="n-map"></span></button>
    <button class="tab" role="tab" id="t-team" aria-controls="p-team" aria-selected="false">Team</button>
    <button class="tab" role="tab" id="t-wins" aria-controls="p-wins" aria-selected="false">Sessions<span class="n" id="n-wins"></span></button>
    <button class="tab" role="tab" id="t-tools" aria-controls="p-tools" aria-selected="false">Tools<span class="n" id="n-tools"></span></button>
    <button class="tab" role="tab" id="t-ledger" aria-controls="p-ledger" aria-selected="false">Ledger<span class="n" id="n-ledger"></span></button>
  </div>

  <section role="tabpanel" id="p-map" aria-labelledby="t-map"></section>
  <section role="tabpanel" id="p-team" aria-labelledby="t-team" hidden></section>
  <section role="tabpanel" id="p-wins" aria-labelledby="t-wins" hidden></section>
  <section role="tabpanel" id="p-tools" aria-labelledby="t-tools" hidden></section>
  <section role="tabpanel" id="p-ledger" aria-labelledby="t-ledger" hidden></section>
</div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="dname" hidden>
  <div class="dh"><b id="dname"></b>
    <span class="dtabs" id="dtabs" hidden><button type="button" id="dt-chat" aria-pressed="true">Conversation</button><button type="button" id="dt-diff" aria-pressed="false">Changes</button></span>
    <button class="x" id="dx" type="button" aria-label="Close">✕</button></div>
  <div class="db" id="dbody" aria-live="polite"></div>
</aside>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const cut = (t, n) => { t = String(t ?? ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
const ago = ms => ms < 60e3 ? 'just now' : ms < 3600e3 ? Math.round(ms / 60e3) + 'm ago'
  : ms < 86400e3 ? Math.round(ms / 3600e3) + 'h ago' : Math.round(ms / 86400e3) + 'd ago';
const PHASE = { moving: 'moving', waiting: 'your turn', busy: 'no reply yet', stopped: 'stopped' };

// Tabs — remembered per viewer; the board is local so localStorage is fine.
const TABS = ['map', 'team', 'wins', 'tools', 'ledger'];
function pick(name) {
  for (const t of TABS) {
    const on = t === name;
    $('t-' + t).setAttribute('aria-selected', String(on));
    $('t-' + t).tabIndex = on ? 0 : -1;
    $('p-' + t).hidden = !on;
  }
  try { localStorage.setItem('as-tab', name); } catch { /* private mode */ }
}
for (const t of TABS) $('t-' + t).onclick = () => pick(t);
document.querySelector('.tabs').addEventListener('keydown', e => {
  const i = TABS.findIndex(t => $('t-' + t).getAttribute('aria-selected') === 'true');
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (!d) return;
  const n = TABS[(i + d + TABS.length) % TABS.length];
  pick(n); $('t-' + n).focus(); e.preventDefault();
});
try { const s = localStorage.getItem('as-tab'); if (TABS.includes(s)) pick(s); } catch { /* */ }

// Unread: the last message time each window had when you last opened it. A window seen for the
// first time counts as read, so opening the board doesn't light up everything.
let SEEN = {};
try { SEEN = JSON.parse(localStorage.getItem('as-seen') ?? '{}'); } catch { /* private mode */ }
const lastAt = s => Date.parse(s.last?.at ?? '') || 0;
const unread = s => lastAt(s) > (SEEN[s.id] ?? Infinity);
function markSeen(s) { SEEN[s.id] = lastAt(s); try { localStorage.setItem('as-seen', JSON.stringify(SEEN)); } catch { /* */ } }

// Notify when a window turns to "your turn". The browser asks permission once, on a click.
const CAN_NOTIFY = 'Notification' in window;
let WAITING = null;                        // ids waiting last tick; null until the first tick
function notifyButton() {
  if (!CAN_NOTIFY) return;
  const on = Notification.permission === 'granted';
  $('notify').hidden = Notification.permission === 'denied';
  $('notify').textContent = on ? 'Notifications on' : 'Notify me';
  $('notify').setAttribute('aria-pressed', String(on));
}
$('notify').onclick = async () => { if (CAN_NOTIFY && Notification.permission === 'default') await Notification.requestPermission(); notifyButton(); };
notifyButton();
function watchWaiting(d) {
  const now = d.sessions.filter(s => s.phase === 'waiting');
  document.title = now.length ? `(${now.length}) agentsemble` : 'agentsemble';
  if (WAITING && CAN_NOTIFY && Notification.permission === 'granted') {
    for (const s of now) {
      if (WAITING.has(s.id)) continue;
      const n = new Notification(`${s.name ?? s.id.slice(0, 8)} is waiting for you`, { body: cut(s.last?.text ?? '', 140), tag: s.id });
      n.onclick = () => { window.focus(); openDrawer(s.id); n.close(); };
    }
  }
  WAITING = new Set(now.map(s => s.id));
}

// Folds survive the 2-second redraw.
const OPENED = new Set();
addEventListener('toggle', e => {
  const d = e.target.closest?.('details[data-k]');
  if (!d) return;
  if (d.open) OPENED.add(d.dataset.k); else OPENED.delete(d.dataset.k);
}, true);
const fold = (k, head, count, body) => `<details class="fold" data-k="${esc(k)}"${OPENED.has(k) ? ' open' : ''}>`
  + `<summary>${head}<span class="cnt">${esc(count)}</span></summary>${body}</details>`;

const resumeCmd = s => `cd "${s.cwd ?? ''}" && claude --resume ${s.id}`;

function card(s, now, isMain) {
  const steps = (s.steps ?? []).map(x => `<div><b>${esc(x.tool ?? 'says')}</b>${esc(x.text)}</div>`).join('');
  return `<button type="button" class="win ${s.phase === 'moving' ? 'moving' : ''} ${isMain ? 'main' : ''}" data-id="${esc(s.id)}">`
    + `<div class="head">${unread(s) ? '<span class="unread" title="new since you last opened it"></span>' : ''}<span class="nm">${esc(s.name ?? s.id.slice(0, 8))}</span>`
    + (s.role ? `<span class="role ${isMain ? '' : 'sub'}">${esc(s.role)}</span>` : '')
    + `<span class="ph ${esc(s.phase)}">${esc(PHASE[s.phase] ?? '')} · ${esc(ago(s.idleMs))}</span></div>`
    + (s.asked ? `<div class="asked"><i>asked</i>${esc(cut(s.asked, 90))}</div>` : '')
    + (steps ? `<div class="flow">${steps}</div>` : '')
    + `<div class="foot"><span>${esc(s.branch ?? '')}</span>`
    + `<span><span class="copy" role="button" tabindex="0" data-win="${esc(s.id)}">open window</span> <span class="copy" role="button" tabindex="0" data-copy="${esc(resumeCmd(s))}">copy resume</span></span></div></button>`;
}

// The live architecture, as a grid: a row per role, a column per top-level area. A number is how
// many files there the role owns; blue ✎ is files it changed now, orange ✎ is changes to files it
// does not own. Click a role to read its conversation, "Open" to bring its terminal up.
const RANK = { moving: 3, busy: 2, waiting: 1, stopped: 0 };
function mapHtml(d) {
  const m = d.map;
  if (!m || !m.areas.length) return '<div class="card"><div class="empty">No tracked files yet.</div></div>';
  const phase = name => d.sessions.filter(s => s.role === name)
    .reduce((best, s) => (RANK[s.phase] ?? -1) > (RANK[best] ?? -1) ? s.phase : best, 'none');
  const A = m.areas;
  const clashIn = a => m.clashes.some(c => c.file.startsWith(a + '/') || (a === '(root)' && !c.file.includes('/')));
  const head = '<tr><th></th>' + A.map(a => `<th>${esc(cut(a.name, 18))}${clashIn(a.name) ? ' <span class="clash" title="two roles changed the same file here">●</span>' : ''}<small>${a.files} file${a.files === 1 ? "" : "s"}</small></th>`).join('') + '<th></th></tr>';
  const rows = m.roles.map(r => {
    const p = phase(r.name);
    const last = d.sessions.filter(s => s.role === r.name).sort((x, y) => x.idleMs - y.idleMs)[0];
    const orders = m.edges.filter(e => e.from === r.name).map(e => `→ ${e.to} ${e.n}`).join(' · ');
    const sub = [r.shared ? 'shares main folder' : '', PHASE[p] ?? 'no window', orders].filter(Boolean).join(' · ');
    const cells = A.map(a => {
      const own = a.own?.[r.name] ?? 0, ch = r.changed?.[a.name] ?? 0, stray = r.stray.includes(a.name);
      if (ch) return `<td class="${stray ? 'stray' : 'work'}" data-diff="${esc(r.name)}" title="${esc(r.name)} changed ${ch} file${ch > 1 ? 's' : ''} here${stray ? ' it does not own' : ''} — click to see">${own || ''} <b>✎${ch}</b></td>`;
      return own ? `<td class="own">${own}</td>` : '<td>·</td>';
    }).join('');
    return `<tr><th class="who"${last ? ` data-open="${esc(last.id)}" role="button" tabindex="0" title="Read its conversation"` : ''}><span class="dot ${esc(p)}"></span>${esc(r.name)}`
      + `${d.sessions.some(s => s.role === r.name && unread(s)) ? '<span class="new">● new</span>' : ''}<small>${esc(sub)}</small></th>${cells}`
      + `<td><button type="button" class="open" data-win="${esc(last?.id ?? '')}" data-role="${esc(r.name)}" title="${last ? 'Bring its terminal to the front, or reopen it' : 'Open a new terminal for this role'}">${last ? 'Open' : 'Start'}</button></td></tr>`;
  }).join('');
  return `<div class="card grid-wrap" style="padding:6px 10px"><table class="grid"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`
    + (m.clashes.length ? `<div class="clashes"><b>${m.clashes.length} file${m.clashes.length > 1 ? 's' : ''} changed by two roles</b> — `
      + m.clashes.map((c, i) => `<button type="button" data-clash="${i}">${esc(c.file)} (${esc(c.who.join(' + '))})</button>`).join(' · ') + '</div>' : '');
}

function teamHtml(d, now) {
  const by = new Map(d.sessions.map(s => [s.id, s]));
  const main = by.get(d.team.main);
  if (!main) return `<div class="empty">No main session yet. Open Claude Code in this repo and run <code>/agentsemble</code>.</div>`
    + (d.sessions.length ? `<div class="cards">${d.sessions.map(s => card(s, now)).join('')}</div>` : '');
  const subs = d.team.subs.map(x => ({ ...x, s: by.get(x.id) })).filter(x => x.s);
  const rest = d.sessions.filter(s => s.id !== main.id && !subs.some(x => x.id === s.id));
  return `<div class="sub" style="width:min(460px,100%)">${card(main, now, true)}</div>`
    + (subs.length ? `<div class="trunk"></div><div class="subs">${subs.map(x => `<div class="sub">`
      + (x.order ? `<div class="order"><b>last order</b> ${esc(cut(x.order.text, 80))}</div>` : '')
      + card(x.s, now) + '</div>').join('')}</div>` : '')
    + (rest.length ? fold('team:rest', '<b>Other sessions in this repo</b>', rest.length, `<div class="cards" style="padding:8px 0">${rest.map(s => card(s, now)).join('')}</div>`) : '');
}

function winsHtml(d, now) {
  const stopped = d.sessions.filter(s => s.phase === 'stopped');
  const active = d.sessions.filter(s => s.phase !== 'stopped');
  const others = d.live.filter(w => !w.here);
  const byProj = new Map();
  for (const w of others) byProj.set(w.project ?? '?', [...(byProj.get(w.project ?? '?') ?? []), w]);
  const lv = w => `<div class="row"><span class="what">${esc(w.name ?? w.id.slice(0, 8))}</span><span class="when">${esc(ago(now - w.updatedAt))}</span></div>`;
  return (active.length ? `<div class="cards">${active.map(s => card(s, now, s.role === 'main')).join('')}</div>` : '<div class="empty">No active sessions.</div>')
    + `<div class="card" style="margin-top:14px">`
    + (stopped.length ? fold('wins:stopped', '<b>Stopped</b> quiet over 10 minutes', stopped.length, `<div class="cards" style="padding:8px">${stopped.map(s => card(s, now)).join('')}</div>`) : '')
    + [...byProj].map(([p, ws]) => fold('live:' + p, `<b>${esc(p)}</b> open elsewhere`, ws.length, ws.map(lv).join(''))).join('')
    + '</div>';
}

function toolsHtml(d) {
  const item = (cls, t) => `<span class="i ${cls} ${esc(t.st)}" title="${esc({ ok: 'as planned', miss: 'planned, not installed', extra: 'installed, not planned', plan: 'not set up yet' }[t.st] ?? '')}">${esc(t.name)}</span>`;
  return `<div class="card">` + d.roles.map(r => {
    const k = r.kit;
    const setUp = !k.skills.some(i => i.st === 'plan');
    return `<div class="kit"><span class="who">${esc(r.name)}</span>`
      + (k.model ? item('plug', { ...k.model, name: 'model ' + k.model.name }) : '')
      + (r.autonomy ? `<span class="i shared" title="how far this role goes before checking in">${esc(r.autonomy)}</span>` : '')
      + k.skills.map(i => item('', i)).join('') + k.plugins.map(i => item('plug', i)).join('')
      + k.shared.map(s => `<span class="i shared" title="tracked by the repo; every role has it">${esc(s)}</span>`).join('')
      + (r.shared ? '<span class="note">shares the main folder and its tools</span>' : '')
      + (setUp || r.shared ? '' : `<span class="note">not set up — node bin/setup.mjs ${esc(r.name)}</span>`) + '</div>';
  }).join('') + '</div><p class="fine">From agents.json (plan) against each worktree\'s .claude (installed). Plugins not named in the plan follow your global settings.</p>';
}

function ledgerRow(r, now) {
  const cls = r.kind === 'claim' ? 'claim' : r.kind === 'verdict' ? r.v : 'note';
  const t = Date.parse(r.at);
  return `<div class="row"><span class="rid">${esc(r.id ?? '')}</span><span class="tag ${esc(cls)}">${esc(r.kind === 'verdict' ? r.v : r.kind)}</span>`
    + `<span class="what">${esc(r.what ?? r.note ?? r.text ?? '')}</span><span class="when">${esc(r.by ?? '')}${Number.isFinite(t) ? ' · ' + ago(now - t) : ''}</span></div>`;
}
function ledgerHtml(g, now) {
  if (!g.claims.length && !g.notes.length) return '<div class="empty">The ledger is empty. The builder adds claims with <code>/ops claim</code>.</div>';
  const open = g.claims.filter(c => !c.done), done = g.claims.filter(c => c.done);
  return `<div class="card">` + (open.length ? open.map(c => c.rows.map(r => ledgerRow(r, now)).join('')).join('') : '<div class="empty">No open claims.</div>') + '</div>'
    + `<div class="card">`
    + (done.length ? fold('led:done', '<b>Done</b> last verdict confirm', done.length, done.map(c => fold('led:' + c.id,
        `<b>${esc(c.id)}</b> ${esc(cut(c.rows[0].what ?? '', 70))}`, c.rows.filter(r => r.kind === 'verdict').map(r => r.v).join(' → '),
        c.rows.map(r => ledgerRow(r, now)).join(''))).join('')) : '')
    + g.notes.map(n => fold('note:' + n.label, `<b>${esc(n.label)}</b> notes`, n.rows.length, n.rows.map(r => ledgerRow(r, now)).join(''))).join('')
    + '</div>';
}

// Compare with what we last wrote, not with innerHTML — the browser re-serialises it, so that
// comparison is almost never equal and every panel would be rebuilt (and open <details> closed) every tick.
const PREV = {};
function paint(id, html) { if (PREV[id] === html) return; PREV[id] = html; $(id).innerHTML = html; }
let FAILS = 0;

let LAST = null;
let BUSY = false;
async function tick() {
  if (BUSY) return;   // a slow board must not pile up requests
  BUSY = true;
  try { await tickOnce(); } finally { BUSY = false; }
}
async function tickOnce() {
  let d;
  try {
    const r = await fetch('/api/board', { cache: 'no-store' });
    if (!r.ok) { paint('tally', esc(`board error ${r.status}: ${(await r.text()).slice(0, 200)}`)); return; }
    d = await r.json();
  } catch {
    // One missed beat is normal (a restart); say so only when it keeps failing.
    if (++FAILS >= 3) paint('tally', 'board server not reachable — is <code>board.mjs</code> still running?');
    return;
  }
  FAILS = 0;
  LAST = d;
  for (const s of d.sessions) {
    if (!(s.id in SEEN) || (s.id === OPEN_ID && unread(s))) markSeen(s);
  }
  watchWaiting(d);
  const now = d.now;
  const off = d.roles.reduce((a, r) => a + [...r.kit.skills, ...r.kit.plugins].filter(i => i.st === 'miss' || i.st === 'extra').length, 0);
  paint('tally', `<b>${d.sessions.filter(s => s.phase !== 'stopped').length}</b> active · <b>${d.open.length}</b> open claims`
    + (off ? ` · <span class="warn">${off} tool mismatch</span>` : ''));
  $('repo').textContent = [d.repo.branch, d.repo.head?.hash, d.repo.dirty.length ? d.repo.dirty.length + ' uncommitted' : '',
    d.repo.ahead ? d.repo.ahead + ' ahead' : ''].filter(Boolean).join(' · ');
  $('n-wins').textContent = d.sessions.length || '';
  $('n-tools').textContent = off || '';
  $('n-ledger').textContent = d.open.length || '';
  paint('p-map', mapHtml(d));
  $('n-map').textContent = d.map?.clashes.length ? '⚠ ' + d.map.clashes.length : '';
  paint('p-team', teamHtml(d, now));
  paint('p-wins', winsHtml(d, now));
  paint('p-tools', toolsHtml(d));
  paint('p-ledger', ledgerHtml(d.groups, now));
}

// Copy the resume command; where the clipboard is blocked, show it to copy by hand.
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) {
    e.stopPropagation();
    const cmd = c.dataset.copy;
    (navigator.clipboard?.writeText(cmd) ?? Promise.reject()).then(() => { c.textContent = 'copied'; },
      () => { c.outerHTML = `<code class="cmd">${esc(cmd)}</code>`; });
    return;
  }
  const o = e.target.closest('[data-win]');
  if (o) { e.stopPropagation(); return openWindow(o.dataset.win, o.dataset.role); }
  const df = e.target.closest('[data-diff]');
  if (df) {
    const last = LAST?.sessions.filter(x => x.role === df.dataset.diff).sort((x, y) => x.idleMs - y.idleMs)[0];
    if (last) return openDrawer(last.id).then(() => showChanges(df.dataset.diff));
    OPENER = document.activeElement; OPEN_ID = null; DROLE = df.dataset.diff;
    $('dname').textContent = DROLE; $('dtabs').hidden = false; $('drawer').hidden = false; $('dx').focus();
    return showChanges(DROLE);
  }
  const k = e.target.closest('[data-clash]');
  if (k) return openClash(Number(k.dataset.clash));
  const w = e.target.closest('.win') ?? e.target.closest('[data-open]');
  if (w) openDrawer(w.dataset.id ?? w.dataset.open);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-copy],[data-win]')) { e.preventDefault(); e.target.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-open]')) { e.preventDefault(); openDrawer(e.target.dataset.open); }
});

// Open a role's terminal on this PC: the board brings a live window forward or reopens a closed one.
const SAY = { ok: 'Brought its window to the front', opened: 'Opened a new terminal', notfound: 'Window not found — is it still open?',
  unnamed: 'That window has no name — run /rename <role> in it once', noname: 'That window has no name — run /rename <role> in it once',
  unsupported: 'Opening windows needs the board running on Windows itself, not in a container — copy the resume command instead',
  failed: 'Could not open it' };
function toast(t) {
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t;
  document.body.append(el); setTimeout(() => el.remove(), 4000);
}
async function openWindow(id, role) {
  const q = id ? 'id=' + encodeURIComponent(id) : 'role=' + encodeURIComponent(role ?? '');
  try {
    const r = await fetch('/api/open?' + q, { method: 'POST' });
    toast(r.ok ? SAY[(await r.json()).result] ?? 'Done' : 'Could not open it (' + r.status + ')');
  } catch { toast('Board not reachable'); }
}

// Drawer: one session's conversation.
let OPEN_ID = null, START = 0, OPENER = null;
function bubble(it) {
  const t = it.at ? new Date(it.at).toLocaleTimeString() : '';
  if (it.who === 'tools') return `<details class="tools"><summary>${it.tools.length} tool call${it.tools.length > 1 ? 's' : ''}</summary><ol>${it.tools.map(x => `<li><b>${esc(x.name)}</b> ${esc(x.text)}</li>`).join('')}</ol></details>`;
  const from = it.who === 'in' ? `from ${esc(it.from)} · ` : '';
  return `<div class="bub ${esc(it.who)}"><span class="t">${from}${esc(t)}</span>${esc(it.text)}</div>`;
}
// Changes: what a role changed, as files and a coloured patch.
let DROLE = null;
const patchHtml = p => `<pre class="patch">${p.split('\n').map(l => {
  const c = l.startsWith('+') && !l.startsWith('+++') ? 'a' : l.startsWith('-') && !l.startsWith('---') ? 'd' : /^(@@|diff |index )/.test(l) ? 'h' : '';
  return c ? `<span class="${c}">${esc(l)}</span>` : esc(l);
}).join('\n')}</pre>`;
const filesHtml = fs => `<div class="files">${fs.map(f => `<span>${esc(f.path)}</span>`
  + (f.add === null ? '<span class="a">new</span><span></span>' : `<span class="a">+${f.add}</span><span class="d">−${f.del}</span>`)).join('')}</div>`;
function drawerTab(view) {
  $('dt-chat').setAttribute('aria-pressed', String(view === 'chat'));
  $('dt-diff').setAttribute('aria-pressed', String(view === 'diff'));
}
async function showChanges(role) {
  drawerTab('diff');
  $('dbody').innerHTML = '<div class="empty">Loading…</div>';
  const r = await fetch('/api/changes?role=' + encodeURIComponent(role));
  if (!r.ok) { $('dbody').innerHTML = '<div class="empty">No changes to show.</div>'; return; }
  const c = await r.json();
  $('dbody').innerHTML = c.files.length
    ? `<p class="fine">${esc(role)}'s branch against main, plus uncommitted work.</p>` + filesHtml(c.files) + patchHtml(c.patch)
    : '<div class="empty">No changes yet.</div>';
}
async function openClash(i) {
  const c = LAST?.map?.clashes[i];
  if (!c) return;
  OPEN_ID = null; DROLE = null; OPENER = document.activeElement;
  $('dname').textContent = c.file; $('dtabs').hidden = true;
  $('drawer').hidden = false; $('dx').focus();
  const parts = await Promise.all(c.who.map(async who => {
    const r = await fetch(`/api/changes?role=${encodeURIComponent(who)}&file=${encodeURIComponent(c.file)}`);
    return `<div class="who">${esc(who)}</div>` + (r.ok ? patchHtml((await r.json()).patch || '(no diff)') : '<div class="empty">Not available.</div>');
  }));
  $('dbody').innerHTML = `<p class="fine">Both roles changed this file. Merge one, then have the other rebase on it.</p>` + parts.join('');
}
$('dt-chat').onclick = () => { if (OPEN_ID) openDrawer(OPEN_ID); };
$('dt-diff').onclick = () => { if (DROLE) showChanges(DROLE); };

async function openDrawer(id) {
  if ($('drawer').hidden) OPENER = document.activeElement;
  OPEN_ID = id;
  const s = LAST?.sessions.find(x => x.id === id);
  if (s) markSeen(s);
  const role = s?.role && LAST?.roles.find(r => r.name === s.role && !r.shared) ? s.role : null;
  DROLE = role; $('dtabs').hidden = !role; drawerTab('chat');
  $('dname').textContent = s?.name ?? id.slice(0, 8);
  $('dbody').innerHTML = '<div class="empty">Loading…</div>';
  $('drawer').hidden = false; $('dx').focus();
  const r = await fetch('/api/log?id=' + encodeURIComponent(id));
  if (!r.ok) { $('dbody').innerHTML = '<div class="empty">Log not found.</div>'; return; }
  const j = await r.json();
  START = j.start;
  $('dbody').innerHTML = (START > 0 ? '<button class="more" id="more" type="button">Earlier</button>' : '') + j.items.map(bubble).join('');
  $('dbody').scrollTop = $('dbody').scrollHeight;
}
$('dbody').addEventListener('click', async e => {
  if (e.target.id !== 'more') return;
  const j = await (await fetch(`/api/log?id=${encodeURIComponent(OPEN_ID)}&before=${START}`)).json();
  START = j.start;
  e.target.remove();
  $('dbody').insertAdjacentHTML('afterbegin', (START > 0 ? '<button class="more" id="more" type="button">Earlier</button>' : '') + j.items.map(bubble).join(''));
});
function closeDrawer() { $('drawer').hidden = true; OPEN_ID = null; DROLE = null; OPENER?.focus?.(); }
$('dx').onclick = closeDrawer;

tick();
// A hidden tab does not need a board; catch up the moment it is shown again.
setInterval(() => { if (!document.hidden) tick(); }, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script>
</html>
